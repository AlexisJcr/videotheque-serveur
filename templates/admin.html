{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h3 class="fw-bold mb-4"><i class="bi bi-plus-square text-primary me-2"></i>Ajouter un Film au Catalogue</h3>
            <form method="POST" action="{{ url_for('admin_ajouter') }}">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Titre du film</label>
                        <input type="text" name="titre" class="form-control" placeholder="Ex: Interstellar" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Année</label>
                        <input type="number" name="annee" class="form-control" value="2014" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Réalisateur</label>
                        <input type="text" name="realisateur" class="form-control" placeholder="Ex: Christopher Nolan" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Genre</label>
                        <input type="text" name="genre" class="form-control" placeholder="Ex: Science-Fiction" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Synopsis</label>
                        <textarea name="synopsis" class="form-control" rows="3"></textarea>
                    </div>

                    <hr class="border-secondary my-4">
                    <h5 class="fw-bold mb-2">Configuration initiale des supports</h5>

                    <div class="col-12">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="num_dispo" id="numDispo" checked>
                            <label class="form-check-label" for="numDispo">Disponible en Streaming Numérique</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">ID 1er Support Physique (Optionnel)</label>
                        <input type="text" name="support_id" class="form-control font-monospace" placeholder="Ex: INT-BLU-01">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Format Physique</label>
                        <select name="support_format" class="form-select">
                            <option value="Blu-ray">Blu-ray</option>
                            <option value="DVD">DVD</option>
                        </select>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-success w-100 fw-bold">
                            <i class="bi bi-save me-1"></i>Enregistrer le film
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
